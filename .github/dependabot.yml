version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x declares a peer range of >=4.8.4 <6.1.0, so a
      # major TypeScript bump fails `npm ci` with ERESOLVE before the build
      # starts. Dependabot cannot see that and reopened the same broken pull
      # request within seconds of the last one being closed.
      #
      # Ignoring the major only. Minor and patch TypeScript updates still come
      # through, as does eslint, which is grouped with it here but has no such
      # constraint. Lift this when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The Functions worker's Application Insights integration binds against
      # Application Insights SDK 2.x. On 3.x the worker dies on load with a
      # TypeLoadException on ITelemetryInitializer, the host recycles until it
      # gives up, and every request returns 502.
      #
      # The build and the tests are clean either way, so CI cannot catch this
      # and a green Dependabot PR is not evidence of anything. Ignored rather
      # than closed repeatedly. See the comment beside the reference in
      # PermissionInsight.Api.csproj.
      - dependency-name: Microsoft.ApplicationInsights.WorkerService
        update-types: ['version-update:semver-major']

      # The application targets net9.0 and runs on the .NET 9 isolated worker.
      # Moving runtime dependencies onto the .NET 10 package wave while the host
      # stays on 9 is the same shape of risk as the entry above, and buys
      # nothing. Take these together with a move to .NET 10.
      - dependency-name: Microsoft.Extensions.*
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
